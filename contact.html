<html>
<head>
    <title>Contact Page</title>
    <script>
        function validation() {
            var name = document.getElementById("nm").value;
            var email = document.getElementById("mail").value;
            var country = document.getElementById("count").value;
            var comments = document.getElementById("comm").value;
            if (name == "" || email == "" || country == "" || comments == "") {
                window.alert("Please fill in all fields.");
                return false;
            }
            else {
                window.alert("Thank you for your submission!");
                return true;
            }
        }
    </script>
    <style>
        body {
            background-color: #F4F6F9;
            color: #333333;
            font-family: Arial, sans-serif;
        }
        form {
            max-width: 400px;
            margin: 20px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }
    </style>
</head>

<body>
    <h2>please provide your information </h2>
    <form onsubmit="validation()">
        <input type="text" name="name" placeholder=" name" id="nm" /><br /><br />
        <input type="email" name="email" placeholder=" email" id="mail" /><br /><br />
        <input type="text" placeholder="Country" id="count"/><br /><br />
        <textarea  placeholder=" Any Comments" id="comm"></textarea><br /><br />
        <input type="submit" value="subbmit"/>
    </form>










</body>




























</html>
